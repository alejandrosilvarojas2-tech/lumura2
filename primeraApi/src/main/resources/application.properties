spring.application.name=primeraApi
spring.profiles.active=dev

# Defaults — sobrescribir por perfil
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.property-naming-strategy=SNAKE_CASE
app.jwt.expiration=86400000

# JWT_SECRET debe definirse como variable de entorno.
# Sin ella: prod NO arranca; dev usa un secreto efímero por ejecución (ver JwtUtil).
app.jwt.secret=${JWT_SECRET:}

# Frontend (index.html, lumura.js, lumura.css) siempre revalidado para evitar versiones viejas en caché
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.cachecontrol.max-age=0

# Correo transaccional (SMTP — proveedor tipo SendGrid/Mailgun/Brevo).
# MAIL_ENABLED=false (default) => los correos NO se envían, se registran en el log (modo demo).
# Para activarlos define variables de entorno: MAIL_ENABLED, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_FROM.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@lumura.com}
app.mail.enabled=${MAIL_ENABLED:false}
